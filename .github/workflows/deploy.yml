name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: movie-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: movie-app/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}

      # GH Pages is static hosting: a deep link like /movies/123 has no
      # matching file, so it 404s before React Router ever loads. Serving
      # index.html as 404.html lets the client-side router take over.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: movie-app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
